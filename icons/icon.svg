<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b1a8c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 262)">
    <polygon points="0,-150 130,-75 0,0 -130,-75" fill="#ede4ff"/>
    <polygon points="-130,-75 0,0 0,150 -130,75" fill="#c4b0fb"/>
    <polygon points="130,-75 0,0 0,150 130,75" fill="#a78bfa"/>
    <!-- linke Seite: Pfeil nach oben (Rang steigt) -->
    <g transform="translate(-65 37) skewY(30)">
      <path d="M 0 -48 L 38 -6 L 15 -6 L 15 44 L -15 44 L -15 -6 L -38 -6 Z" fill="#3b1a8c"/>
    </g>
    <!-- rechte Seite: S -->
    <g transform="translate(65 37) skewY(-30)">
      <text x="0" y="36" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="104" fill="#3b1a8c" text-anchor="middle">S</text>
    </g>
  </g>
